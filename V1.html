<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dream vs Technoblade ⚔️</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    min-height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center;
    color: white; padding: 20px;
  }
  .card {
    background: rgba(255,255,255,0.08); border-radius: 20px; padding: 30px; max-width: 700px; width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5); text-align: center; backdrop-filter: blur(10px);
  }
  h1 { font-size: 1.6em; margin: 0 0 5px; }
  .subtitle { color: #aaa; margin-bottom: 25px; }
  .pick-grid { display: flex; gap: 20px; justify-content: center; margin: 30px 0; flex-wrap: wrap; }
  .fighter {
    flex: 1; max-width: 250px; min-width: 180px; padding: 25px; border-radius: 16px; cursor: pointer; transition: all .2s;
    border: 3px solid transparent;
  }
  .fighter:hover { transform: translateY(-5px) scale(1.03); }
  .fighter.dream { background: linear-gradient(135deg, #1db95433, #1db95411); }
  .fighter.dream:hover { border-color: #1db954; }
  .fighter.techno { background: linear-gradient(135deg, #e91e6333, #e91e6311); }
  .fighter.techno:hover { border-color: #e91e63; }
  .fighter .emoji { font-size: 3em; }
  .fighter .name { font-size: 1.3em; font-weight: bold; margin-top: 10px; }
  .fighter .special { color: #ccc; font-size: 0.9em; margin-top: 5px; }
  .vs { font-size: 2em; font-weight: 900; color: #ffd700; align-self: center; }
  .hidden { display: none; }
  .arena { margin-top: 10px; }
  .hp-bars { display: flex; gap: 20px; margin-bottom: 20px; }
  .hp-side { flex: 1; text-align: center; }
  .hp-side .label { font-weight: bold; margin-bottom: 6px; }
  .hp-bar { height: 18px; border-radius: 10px; background: #333; overflow: hidden; }
  .hp-fill { height: 100%; border-radius: 10px; transition: width .5s; width: 100%; }
  .hp-fill.dream { background: #1db954; }
  .hp-fill.techno { background: #e91e63; }
  .question { font-size: 1.15em; margin: 20px 0; min-height: 3em; }
  button.choice {
    display: block; width: 100%; margin: 8px 0; padding: 12px; border: 2px solid #444;
    border-radius: 10px; background: #222; color: white; font-size: 1em; cursor: pointer; transition: all .15s;
  }
  button.choice:hover { border-color: #ffd700; background: #333; }
  button.choice.correct { border-color: #2ecc71; background: #145a32; }
  button.choice.wrong { border-color: #e74c3c; background: #78281f; }
  .battle-log { min-height: 2em; font-size: 1.1em; margin: 15px 0; color: #ffd700; }
  .next {
    background: linear-gradient(135deg, #ffd700, #ff9800); color: #222; border: none;
    padding: 12px 35px; border-radius: 10px; font-size: 1.05em; font-weight: bold; cursor: pointer; margin-top: 8px;
  }
  .progress { color: #999; margin-bottom: 10px; }
  .big { font-size: 3.5em; }
  .taunt { font-size: 1.1em; margin: 10px 0; }
  .shake { animation: shake .4s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
</style>
</head>
<body>
  <div class="card">
    <h1>⚔️ Dream vs Technoblade ⚔️</h1>
    <div class="subtitle">Le quiz-duel légendaire : choisis ton camp et bats l'autre légende !</div>

    <div id="pick-screen">
      <div class="pick-grid">
        <div class="fighter dream" onclick="pick('dream')">
          <div class="emoji">🟩</div>
          <div class="name">Dream</div>
          <div class="special">⚡ Speedrun Strat — Manhunt</div>
        </div>
        <div class="vs">VS</div>
        <div class="fighter techno" onclick="pick('techno')">
          <div class="emoji">🐷</div>
          <div class="name">Technoblade</div>
          <div class="special">🥔 Potato Power — never dies</div>
        </div>
      </div>
    </div>

    <div id="arena" class="arena hidden">
      <div class="hp-bars">
        <div class="hp-side">
          <div class="label" id="you-name"></div>
          <div class="hp-bar"><div class="hp-fill" id="you-hp"></div></div>
          <div id="you-hp-text">100 HP</div>
        </div>
        <div class="vs" style="font-size:1.4em">VS</div>
        <div class="hp-side">
          <div class="label" id="foe-name"></div>
          <div class="hp-bar"><div class="hp-fill" id="foe-hp"></div></div>
          <div id="foe-hp-text">100 HP</div>
        </div>
      </div>
      <div class="progress" id="progress"></div>
      <div class="question" id="question"></div>
      <div id="choices"></div>
      <div class="battle-log" id="log"></div>
      <button id="next" class="next hidden">Attaque suivante ⚔️</button>
    </div>

    <div id="end" class="hidden">
      <div class="big" id="end-emoji"></div>
      <h2 id="end-title"></h2>
      <div class="taunt" id="end-taunt"></div>
      <button class="next" onclick="restart()">Nouveau duel</button>
    </div>
  </div>

<script>
const QUESTIONS = [
  { question: "Quel est le slogan légendaire de Technoblade ?", choices: ["Blood for the Blood God", "Technoblade never dies", "Subscribe to Technoblade", "Potatoes are life"], answer: "Technoblade never dies" },
  { question: "Quel est le nom du format vidéo culte de Dream ?", choices: ["Manhunt", "Bedwars Blitz", "Skywars Challenge", "UHC Solo"], answer: "Manhunt" },
  { question: "De quelle guerre Minecraft légendaire Technoblade était-il le héros ?", choices: ["La Potato War", "La Carrot War", "La Beetroot War", "La Wheat War"], answer: "La Potato War" },
  { question: "Quelle couleur est associée à Dream ?", choices: ["Vert", "Rouge", "Bleu", "Rose"], answer: "Vert" },
  { question: "Quel animal représente Technoblade ?", choices: ["Le cochon 🐷", "La vache 🐮", "Le mouton 🐑", "Le poulet 🐔"], answer: "Le cochon 🐷" },
  { question: "Dans le Dream SMP, quel est le rôle de Dream ?", choices: ["Le grand méchant du serveur", "Le fermier", "Le marchand de village", "Le boulanger"], answer: "Le grand méchant du serveur" },
  { question: "Technoblade est célèbre pour ses victoires en...", choices: ["Bedwars / Minecraft Monday", "Roblox", "Fortnite", "Among Us uniquement"], answer: "Bedwars / Minecraft Monday" },
  { question: "Quelle est la technique signature de Dream en PvP ?", choices: ["Le clutch et le cirque autour de l'adversaire", "La fuite pure", "Le camp dans un trou", "L'AFK strat"], answer: "Le clutch et le cirque autour de l'adversaire" },
  { question: "Quel est le titre honorifique de Technoblade chez ses fans ?", choices: ["Le Roi des Cochons 👑", "Le Baron des Betteraves", "Le Sultan des Sapins", "Le Maire du Nether"], answer: "Le Roi des Cochons 👑" },
  { question: "Comment s'appelle l'équipe iconique Dream + George + Sapnap ?", choices: ["Dream Team", "Three Pigs", "Craft Masters", "The Hunters"], answer: "Dream Team" },
  { question: "Combien de temps a duré la Potato War de Technoblade ?", choices: ["Des mois de farm intensif", "Une soirée", "Deux minutes", "Elle n'a jamais eu lieu"], answer: "Des mois de farm intensif" },
  { question: "Que fait Dream quand il est poursuivi par 4 chasseurs ?", choices: ["Il clutch absolument tout", "Il se rend immédiatement", "Il déconnecte", "Il construit une maison"], answer: "Il clutch absolument tout" },
  { question: "Quel arc du Dream SMP oppose Technoblade à L'Manberg ?", choices: ["La révolution / l'exécution", "Le tournoi de pêche", "La guerre des fleurs", "Le bal de Poudlard"], answer: "La révolution / l'exécution" },
  { question: "Technoblade a gagné Minecraft Monday...", choices: ["Plein de fois, il dominait", "Jamais", "Une fois par chance", "Il ne participait pas"], answer: "Plein de fois, il dominait" },
];

const NAMES = { dream: '🟩 Dream', techno: '🐷 Technoblade' };
const HIT = ["CRITIQUE ! 💥", "Touché ! ⚔️", "Direct dans le mille ! 🎯"];
const MISS = ["Raté... l'adversaire esquive ! 🛡️", "Aïe, c'est vous qui prenez le coup ! 😵", "Le coup passe à côté ! 💨"];

let you = null, foe = null;
let youHp = 100, foeHp = 100;
let questions = [], current = 0, answered = false;

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pick(fighter) {
  you = fighter;
  foe = fighter === 'dream' ? 'techno' : 'dream';
  document.getElementById('pick-screen').classList.add('hidden');
  document.getElementById('arena').classList.remove('hidden');
  document.getElementById('you-name').textContent = NAMES[you] + ' (vous)';
  document.getElementById('foe-name').textContent = NAMES[foe];
  document.getElementById('you-hp').classList.add(you);
  document.getElementById('foe-hp').classList.add(foe);
  startDuel();
}

function startDuel() {
  questions = shuffle(QUESTIONS);
  current = 0;
  showQuestion();
}

function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById('progress').textContent = `Round ${current + 1} / ${questions.length}`;
  document.getElementById('question').textContent = q.question;
  const container = document.getElementById('choices');
  container.innerHTML = '';
  shuffle(q.choices).forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.textContent = c;
    btn.onclick = () => attack(q, c, btn);
    container.appendChild(btn);
  });
  document.getElementById('next').classList.add('hidden');
  document.getElementById('log').textContent = '';
}

function attack(q, choice, btn) {
  if (answered) return;
  answered = true;
  const buttons = document.querySelectorAll('.choice');
  buttons.forEach(b => { if (b.textContent === q.answer) b.classList.add('correct'); });
  if (choice === q.answer) {
    const damage = [10, 15, 20][Math.floor(Math.random() * 3)];
    foeHp = Math.max(0, foeHp - damage);
    document.getElementById('foe-hp').parentElement.parentElement.classList.add('shake');
    document.getElementById('log').textContent = HIT[Math.floor(Math.random() * HIT.length)] + ` −${damage} HP !`;
  } else {
    youHp = Math.max(0, youHp - 12);
    btn.classList.add('wrong');
    document.getElementById('you-hp').parentElement.parentElement.classList.add('shake');
    document.getElementById('log').textContent = MISS[Math.floor(Math.random() * MISS.length)] + ' −12 HP pour vous !';
  }
  updateHp();
  setTimeout(() => document.querySelectorAll('.hp-side').forEach(e => e.classList.remove('shake')), 450);
  if (foeHp === 0 || youHp === 0 || current + 1 >= questions.length) {
    setTimeout(showEnd, 1600);
  } else {
    const nextBtn = document.getElementById('next');
    nextBtn.classList.remove('hidden');
    nextBtn.onclick = () => { current++; showQuestion(); };
  }
}

function updateHp() {
  document.getElementById('you-hp').style.width = youHp + '%';
  document.getElementById('foe-hp').style.width = foeHp + '%';
  document.getElementById('you-hp-text').textContent = youHp + ' HP';
  document.getElementById('foe-hp-text').textContent = foeHp + ' HP';
}

function showEnd() {
  document.getElementById('arena').classList.add('hidden');
  document.getElementById('end').classList.remove('hidden');
  const won = foeHp <= 0 || (youHp > 0 && foeHp < youHp);
  document.getElementById('end-emoji').textContent = won ? '🏆' : '💀';
  document.getElementById('end-title').textContent = won
    ? (you === 'dream' ? 'Dream wins !' : 'TECHNOBLADE NEVER DIES !')
    : (foe === 'techno' ? 'TECHNOBLADE NEVER DIES !' : 'Dream wins !');
  document.getElementById('end-taunt').textContent = won
    ? (you === 'dream' ? 'Manhunt speedrun en 12 minutes 😎' : 'Le Roi des Cochons règne 👑🐷')
    : 'Retente ta chance, le duel des légendes n\'attend pas...';
}

function restart() {
  youHp = 100; foeHp = 100;
  document.getElementById('end').classList.add('hidden');
  document.getElementById('arena').classList.add('hidden');
  document.getElementById('pick-screen').classList.remove('hidden');
}
</script>
</body>
</html>
